log_format population escape=json '{"time":"$time_iso8601","method":"$request_method",'
    '"status":$status,"requestTime":$request_time,'
    '"upstream":"$upstream_addr","upstreamTime":"$upstream_response_time",'
    '"traceId":"$upstream_http_x_trace_id","instanceId":"$upstream_http_x_instance_id"}';

upstream population_backend {
    zone population_backend 64k;
    server backend:8080 max_fails=1 fail_timeout=5s;
    server backend2:8080 max_fails=1 fail_timeout=5s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log population;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # Named error redirects preserve the original method and request body.
        error_page 418 = @api_mutation;
        if ($request_method !~ ^(GET|HEAD)$) { return 418; }
        proxy_pass http://population_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 95s;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;
        add_header Cache-Control "no-store" always;
    }

    location @api_mutation {
        proxy_pass http://population_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 95s;
        proxy_next_upstream off;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

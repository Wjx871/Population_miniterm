spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-enum-type-handler=org.apache.ibatis.type.EnumTypeHandler
mybatis.mapper-locations=classpath:mapper/*.xml

security.jwt.secret=test-jwt-secret-must-have-at-least-thirty-two-bytes
security.jwt.expire-minutes=120

application.upload.dir=./target/test-uploads
application.upload.max-size-mb=1
population.ai.precheck.enabled=false
population.ai.precheck.storage-dir=./target/test-private-ai-stage
population.ai.precheck.max-material-size-mb=1
population.ai.precheck.rabbit-enabled=false
population.ai.precheck.consumer-concurrency=2
population.ai.precheck.prefetch=1
population.ai.precheck.queue-capacity=1000
population.ai.precheck.max-processing-attempts=3
population.ai.precheck.backoff=PT0.01S,PT0.02S
population.ai.precheck.processing-timeout=PT1S
population.ai.precheck.worker-lease-duration=PT2S
population.ai.precheck.analysis-connect-timeout=PT0.1S
population.ai.precheck.analysis-read-timeout=PT0.8S
